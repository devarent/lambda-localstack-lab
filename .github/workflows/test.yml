name: AWS Lambda CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-local-server:
    name: Test Local Server
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Start local server
      run: |
        node local_server.mjs &
        sleep 5
    
    - name: Test server
      run: |
        curl -i http://localhost:9000 | grep "Hello from AWS Lambda"
    
    - name: Test delete function URL
      run: |
        curl -X POST http://localhost:9000/delete-function-url
        sleep 1
        curl http://localhost:9000 | grep '{"Message":null}'
    
    - name: Activate function URL
      run: |
        curl -X POST http://localhost:9000/activate-function-url
        sleep 1
        curl -i http://localhost:9000 | grep "Hello from AWS Lambda"

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: |
        docker build -t lambda-pert5 .
    
    - name: Run Docker container
      run: |
        docker run -d -p 9000:9000 --name lambda-container lambda-pert5
        sleep 5
    
    - name: Test Docker container
      run: |
        curl -i http://localhost:9000 | grep "Hello from AWS Lambda"
    
    - name: Test delete via API
      run: |
        curl -X POST http://localhost:9000/delete-function-url
        sleep 1
        curl http://localhost:9000 | grep '{"Message":null}'
    
    - name: Cleanup
      if: always()
      run: |
        docker stop lambda-container
        docker rm lambda-container

  localemu-test:
    name: Test with LocalEmu
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Start LocalEmu
      run: |
        docker run --rm -d --name localemu \
          -p 4566:4566 \
          -p 4510-4559:4510-4559 \
          -v /var/run/docker.sock:/var/run/docker.sock \
          --user root \
          -e DASHBOARD_API_OPEN=1 \
          localemu/localemu:latest
        sleep 10
    
    - name: Check LocalEmu health
      run: |
        curl http://localhost:4566/_localemu/health
    
    - name: Setup AWS CLI for LocalEmu
      run: |
        export AWS_ENDPOINT_URL=http://localhost:4566
        export AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE
        export AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
        export AWS_DEFAULT_REGION=us-east-1
        echo "AWS_ENDPOINT_URL=http://localhost:4566" >> $GITHUB_ENV
        echo "AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE" >> $GITHUB_ENV
        echo "AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY" >> $GITHUB_ENV
        echo "AWS_DEFAULT_REGION=us-east-1" >> $GITHUB_ENV
    
    - name: Deploy Lambda to LocalEmu
      run: |
        aws iam create-role \
          --role-name lambda-execution-role \
          --assume-role-policy-document '{
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": {
                  "Service": "lambda.amazonaws.com"
                },
                "Action": "sts:AssumeRole"
              }
            ]
          }' || true
        
        zip -r function.zip index.mjs index.html
        
        aws lambda create-function \
          --function-name lambda-wsl-tutorial \
          --runtime nodejs22.x \
          --handler index.handler \
          --role arn:aws:iam::000000000000:role/lambda-execution-role \
          --zip-file fileb://function.zip || aws lambda update-function-code \
          --function-name lambda-wsl-tutorial \
          --zip-file fileb://function.zip
        
        aws lambda create-function-url-config \
          --function-name lambda-wsl-tutorial \
          --auth-type NONE || true
    
    - name: Test Lambda function
      run: |
        FUNCTION_URL=$(aws lambda get-function-url-config \
          --function-name lambda-wsl-tutorial \
          --query FunctionUrl \
          --output text)
        
        curl -i $FUNCTION_URL | grep "Hello from AWS Lambda"
    
    - name: Cleanup
      if: always()
      run: |
        docker stop localemu || true
        docker rm -f localemu || true
